<ng-container *ngIf="memberService.member()">
  <div class="flex flex-col gap-3">
    <div class="flex gap-3">
      <span class="font-semibold">Member since:</span>
      <span>{{ memberService.member()?.created | date: "longDate" }}</span>
    </div>
    <div class="flex gap-3">
      <span class="font-semibold">Last active:</span>
      <span>{{
        memberService.member()?.lastActive | date: "dd MMM yyyy h:mm a"
      }}</span>
    </div>
    <h3 class="text-lg font-semibold text-primary">
      About {{ memberService.member()?.displayName }}
    </h3>
    <ng-container *ngIf="!memberService.editMode(); else formTemplate">
      <div>{{ memberService.member()?.description }}</div>
    </ng-container>
    <ng-template #formTemplate>
      <form
        #editForm="ngForm"
        (ngSubmit)="updateProfile()"
        class="flex flex-col w-full gap-4"
      >
        <label class="relative block w-full">
          <input
            type="text"
            name="displayName"
            [(ngModel)]="editableMember.displayName"
            placeholder="Display Name"
            class="peer input input-bordered w-full placeholder-transparent focus:outline-none pt-4"
          />
          <span
            class="absolute start-3 top-2 text-xs text-gray-500 transition-all peer-placeholder-shown:top-3.5 peer-placeholder-shown:text-sm peer-placeholder-shown:text-gray-400 peer-focus:top-2 peer-focus:text-xs peer-focus:text-primary pointer-events-none"
          >
            Display Name
          </span>
        </label>
        <label class="relative block w-full">
          <input
            type="text"
            name="country"
            [(ngModel)]="editableMember.country"
            placeholder="Country"
            class="peer input input-bordered w-full placeholder-transparent focus:outline-none pt-4"
          />
          <span
            class="absolute start-3 top-2 text-xs text-gray-500 transition-all peer-placeholder-shown:top-3.5 peer-placeholder-shown:text-sm peer-placeholder-shown:text-gray-400 peer-focus:top-2 peer-focus:text-xs peer-focus:text-primary pointer-events-none"
          >
            Country
          </span>
        </label>
        <label class="relative block w-full">
          <input
            type="text"
            name="city"
            [(ngModel)]="editableMember.city"
            placeholder=" "
            class="peer input input-bordered w-full placeholder-transparent focus:outline-none pt-4"
          />
          <span
            class="absolute start-3 top-2 text-xs text-gray-500 transition-all peer-placeholder-shown:top-3.5 peer-placeholder-shown:text-sm peer-placeholder-shown:text-gray-400 peer-focus:top-2 peer-focus:text-xs peer-focus:text-primary pointer-events-none"
          >
            City
          </span>
        </label>
        <label class="relative block w-full">
          <textarea
            rows="3"
            name="description"
            [(ngModel)]="editableMember.description"
            placeholder="Description"
            class="peer textarea textarea-bordered w-full placeholder-transparent focus:outline-none pt-4"
          ></textarea>
          <span
            class="absolute start-3 top-2 text-xs text-gray-500 transition-all peer-placeholder-shown:top-3.5 peer-placeholder-shown:text-sm peer-placeholder-shown:text-gray-400 peer-focus:top-2 peer-focus:text-xs peer-focus:text-primary pointer-events-none"
          >
            Description
          </span>
        </label>
        <div class="flex self-end">
          <button
            [disabled]="!editForm.dirty"
            type="submit"
            class="btn btn-success"
          >
            Submit
          </button>
        </div>
      </form>
    </ng-template>
  </div>
</ng-container>
