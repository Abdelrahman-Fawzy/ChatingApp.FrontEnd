<div class="flex flex-col w-full">
  <div class="flex justify-between items-center">
    <div class="tabs tabs-box tabs-lg text-primary w-fit">
      <button
        *ngFor="let tab of tabs"
        role="tab"
        class="tab"
        [class.tab-active]="predicate === tab.value"
        (click)="setPredicate(tab.value)"
      >
        {{ tab.label }}
      </button>
    </div>
    <ng-container *ngIf="paginatedResult?.metadata as metadata">
      <app-paginator
        [hidden]="metadata.totalCount === 0"
        [pageNumber]="metadata.currentPage"
        [totalCount]="metadata.totalCount"
        [totalPages]="metadata.totalPages"
        [pageSize]="metadata.pageSize"
        (pageChange)="onPageChange($event)"
      />
    </ng-container>
  </div>
  <div class="grid grid-cols-5 gap-6">
    <ng-container *ngIf="members.length > 0; else noData">
      <app-member-card
        [member]="member"
        *ngFor="let member of members; trackBy: trackByMemberId"
      ></app-member-card>
    </ng-container>
    <ng-template #noData>
      <div class="mt-3 text-lg">لا يوجد سجل إعجابات</div>
    </ng-template>
  </div>
</div>
