<div
  class="card bg-base-100 w-1/2 mx-auto flex flex-col p-6 rounded-lg shadow-lg"
>
  <div class="card-title justify-center text-3xl text-primary">Sign Up</div>
  <div class="card-body w-full">
    <form
      class="flex flex-col gap-4 w-full"
      #registerForm="ngForm"
      (ngSubmit)="register()"
    >
      <input
        type="text"
        class="input w-full border border-gray-300"
        placeholder="Display Name"
        [(ngModel)]="credentials.displayName"
        name="displayName"
      />
      <input
        type="email"
        class="input w-full border border-gray-300"
        placeholder="Email"
        [(ngModel)]="credentials.email"
        name="email"
      />
      <input
        type="password"
        class="input w-full border border-gray-300"
        placeholder="Password"
        [(ngModel)]="credentials.password"
        name="password"
      />

      <div class="flex items-center justify-end gap-3">
        <button class="btn btn-primary" type="submit">Register</button>
        <button class="btn btn-secondary" type="button" (click)="cancel()">
          Cancel
        </button>
      </div>
    </form>
  </div>
</div>
