<label class="relative block w-full text-left">
  <input
    [type]="type"
    [max]="maxDate"
    [min]="minDate"
    [formControl]="control"
    [placeholder]="placeholder"
    class="peer input input-bordered w-full placeholder-transparent focus:outline-none pt-4"
    [class.input-error]="control.invalid && control.touched"
    [class.input-success]="control.valid && control.touched"
  />
  <span
    class="absolute start-3 top-2 text-xs text-gray-500 transition-all peer-placeholder-shown:top-3.5 peer-placeholder-shown:text-sm peer-placeholder-shown:text-gray-400 peer-focus:top-2 peer-focus:text-xs peer-focus:text-primary pointer-events-none"
  >
    {{ label }}
  </span>
  <div class="flex flex-col gap-2" *ngIf="control.invalid">
    <span
      *ngIf="control.hasError('required') && control.touched"
      class="text-error text-sm mt-1"
    >
      هذا الحقل مطلوب
    </span>
    <span
      *ngIf="control.hasError('email') && control.touched"
      class="text-error text-sm mt-1"
    >
      يرجى إدخال عنوان بريد إلكتروني صحيح
    </span>
    <span
      *ngIf="control.hasError('minlength') && control.touched"
      class="text-error text-sm mt-1"
    >
      يجب أن يكون طول الحقل على الأقل
      {{ control.errors?.["minlength"].requiredLength }} أحرف
    </span>
    <span
      *ngIf="control.hasError('maxlength') && control.touched"
      class="text-error text-sm mt-1"
    >
      يجب أن يكون طول الحقل على الأكثر
      {{ control.errors?.["maxlength"].requiredLength }} أحرف
    </span>
    <span
      *ngIf="control.hasError('passwordMismatch') && control.touched"
      class="text-error text-sm mt-1"
    >
      كلمة المرور غير متطابقة
    </span>
  </div>
</label>
