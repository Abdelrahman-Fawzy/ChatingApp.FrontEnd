<header
  class="p-3 px-8 w-full fixed top-0 z-50 bg-gradient-to-r from-primary to-black"
>
  <div class="flex items-center p-xl-3">
    <a
      [routerLink]="'/home'"
      routerLinkActive="text-accent"
      class="text-white border-r-white border-r-2 flex items-center gap-2 pr-5 mr-5 max-h-16"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
        fill="currentColor"
        class="size-6"
      >
        <path
          d="M4.5 6.375a4.125 4.125 0 1 1 8.25 0 4.125 4.125 0 0 1-8.25 0ZM14.25 8.625a3.375 3.375 0 1 1 6.75 0 3.375 3.375 0 0 1-6.75 0ZM1.5 19.125a7.125 7.125 0 0 1 14.25 0v.003l-.001.119a.75.75 0 0 1-.363.63 13.067 13.067 0 0 1-6.761 1.873c-2.472 0-4.786-.684-6.76-1.873a.75.75 0 0 1-.364-.63l-.001-.122ZM17.25 19.128l-.001.144a2.25 2.25 0 0 1-.233.96 10.088 10.088 0 0 0 5.06-1.01.75.75 0 0 0 .42-.643 4.875 4.875 0 0 0-6.957-4.611 8.586 8.586 0 0 1 1.71 5.157v.003Z"
        />
      </svg>
      <span class="text-uppercase font-semibold text-xl">Chating App</span>
    </a>
    <nav class="flex items-center gap-3 text-white text-lg">
      <ng-container *ngIf="accountService.currentUser()">
        <a [routerLink]="'/members'" routerLinkActive="text-accent">Matches</a>
        <a [routerLink]="'/links'" routerLinkActive="text-accent">Links</a>
        <a [routerLink]="'/messages'" routerLinkActive="text-accent"
          >Messages</a
        >
      </ng-container>
      <a [routerLink]="'/errors'" routerLinkActive="text-accent">Errors</a>
    </nav>

    <span
      class="loading loading-spinner text-accent mx-3"
      *ngIf="busyService.busyRequestCount() > 0"
    ></span>
    <div class="flex items-center gap-6 ml-auto">
      <div class="dropdown mr-5 dropdown-end">
        <button
          tabindex="1"
          class="flex flex-col justify-center align-middle text-white cursor-pointer uppercase text-xs"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="1.5"
            stroke="currentColor"
            class="size-6 flex self-center"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M9.53 16.122a3 3 0 0 0-5.78 1.128 2.25 2.25 0 0 1-2.4 2.245 4.5 4.5 0 0 0 8.4-2.245c0-.399-.078-.78-.22-1.128Zm0 0a15.998 15.998 0 0 0 3.388-1.62m-5.043-.025a15.994 15.994 0 0 1 1.622-3.395m3.42 3.42a15.995 15.995 0 0 0 4.764-4.648l3.876-5.814a1.151 1.151 0 0 0-1.597-1.597L14.146 6.32a15.996 15.996 0 0 0-4.649 4.763m3.42 3.42a6.776 6.776 0 0 0-3.42-3.42"
            />
          </svg>
          <span>{{ selectedTheme() }}</span>
        </button>
        <ul
          tabindex="1"
          class="dropdown-content menu bg-base-100 rounded-box z-1 w-52 p-2 shadow-sm"
        >
          <li
            *ngFor="let theme of themes; trackBy: trackByIndex"
            (click)="handleSelectTheme(theme)"
          >
            <a>{{ theme }}</a>
          </li>
        </ul>
      </div>
      <ng-container *ngIf="accountService.currentUser() as currentUser$">
        <div class="flex items-center gap-2">
          <img
            [src]="currentUser$.imageURL || 'assets/user.png'"
            alt=""
            class="rounded-full w-10 h-10"
          />
          <div class="dropdown dropdown-bottom dropdown-end">
            <div tabindex="0" role="button" class="text-white m-1">
              {{ currentUser$.displayName }}
            </div>
            <ul
              tabindex="0"
              class="dropdown-content menu bg-base-100 rounded-box z-[1] w-52 p-2 shadow"
            >
              <li>
                <a routerLink="members/{{ currentUser$.id }}/profile"
                  >Edit Profile</a
                >
              </li>
              <li><button (click)="logout()">Logout</button></li>
            </ul>
          </div>
        </div>
      </ng-container>

      <form
        *ngIf="!accountService.currentUser() as currentUser$"
        #loginForm="ngForm"
        (ngSubmit)="login()"
        class="flex items-center gap-3 ml-auto"
      >
        <input
          type="text"
          class="input h-10"
          name="email"
          placeholder="Email"
          [(ngModel)]="credentials.email"
        />
        <input
          type="Password"
          class="input h-10"
          name="password"
          placeholder="password"
          [(ngModel)]="credentials.password"
        />
        <button class="btn btn-sm h-10" type="submit">Login</button>
      </form>
    </div>
  </div>
</header>
